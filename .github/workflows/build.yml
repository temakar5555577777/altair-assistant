name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Tests (Core)
        if: hashFiles('tests/Altair.Core.Tests/Altair.Core.Tests.csproj') != ''
        run: dotnet test tests/Altair.Core.Tests/Altair.Core.Tests.csproj -c Release --logger "console;verbosity=normal"

      - name: Build Windows layer
        run: dotnet build src/Altair.Windows/Altair.Windows.csproj -c Release

      - name: Publish app
        if: hashFiles('src/Altair.App/Altair.App.csproj') != ''
        run: dotnet publish src/Altair.App/Altair.App.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -o publish

      - name: Self-test on real Windows
        if: hashFiles('src/Altair.App/Altair.App.csproj') != ''
        shell: pwsh
        timeout-minutes: 5
        run: |
          $p = Start-Process -FilePath publish\AltairAssistant.exe -ArgumentList '--selftest' -PassThru
          if (-not $p.WaitForExit(240000)) { $p.Kill(); Write-Error 'Self-test timeout' }
          if (Test-Path publish\selftest.log) { Get-Content publish\selftest.log } else { Write-Host 'no selftest.log' }
          if (Test-Path publish\crash.log) { Get-Content publish\crash.log }
          if (Test-Path publish\selftest.live.log) { Write-Host '--- live ---'; Get-Content publish\selftest.live.log }
          Get-WinEvent -FilterHashtable @{LogName='Application'; Level=2} -MaxEvents 3 -ErrorAction SilentlyContinue | Format-List TimeCreated, Message
          Write-Host "exit code: $($p.ExitCode)"
          Remove-Item publish\selftest.log, publish\crash.log -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Package installer (Velopack)
        if: hashFiles('src/Altair.App/Altair.App.csproj') != ''
        shell: pwsh
        run: |
          dotnet tool install -g vpk
          $v = "1.0.${{ github.run_number }}"
          vpk pack --packId Altair.Assistant --packVersion $v --packDir publish --mainExe AltairAssistant.exe --packTitle "Altair Assistant" --runtime win-x64 --icon src/Altair.App/Assets/app.ico --outputDir releases

      - uses: actions/upload-artifact@v4
        if: hashFiles('releases/*') != ''
        with:
          name: Altair-Setup
          path: releases/*Setup.exe

      - uses: actions/upload-artifact@v4
        if: hashFiles('releases/*') != ''
        with:
          name: Altair-Release-Files
          path: releases/

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && hashFiles('releases/*Setup.exe') != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = "v1.0.${{ github.run_number }}"
          $notes = "Сборка $v. Установка: скачайте Altair.Assistant-win-Setup.exe и запустите. Самопроверка на Windows и модульные тесты пройдены."
          gh release create $v (Get-ChildItem releases\*Setup.exe).FullName (Get-ChildItem releases\*.nupkg).FullName releases\releases.win.json releases\RELEASES --title "Altair Assistant $v" --notes $notes --latest
